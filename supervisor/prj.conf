# Comum a todas as placas. Ajustes por placa em boards/<placa>.conf

CONFIG_LOG=y
CONFIG_JSON_LIBRARY=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# Endereços do gateway e do servidor. Com o simulador (pasta sim/), os dois
# ficam no IP do PC, portas 5500 e 5501.
CONFIG_SUPERVISOR_GATEWAY_ADDR="192.168.0.10"
CONFIG_SUPERVISOR_SERVER_ADDR="192.168.0.10"
