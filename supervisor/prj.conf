# Comum a todas as placas. Ajustes por placa em boards/<placa>.conf

CONFIG_LOG=y
CONFIG_JSON_LIBRARY=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# Endereços do gateway e do servidor. O http.c resolve com getaddrinfo, que
# trata IP literal sem precisar do resolver de DNS ligado — e ele está
# desligado de propósito, ver a nota em boards/samd21_xpro.conf.
# Com o simulador (pasta sim/), são o IP do PC nas portas 5500 e 5501.
CONFIG_SUPERVISOR_GATEWAY_ADDR="45.182.14.16"
CONFIG_SUPERVISOR_SERVER_ADDR="45.182.14.16"
