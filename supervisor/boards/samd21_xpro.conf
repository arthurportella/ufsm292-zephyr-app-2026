# OLED1: display SSD1306 por SPI + botões (gpio-keys) + LEDs
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Ethernet SPI (o driver vem do overlay do módulo, ex.: eth_w5500.overlay)
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y

# IP fixo da placa (mesma rede do PC com o simulador / do gateway e servidor)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.0.1"
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=1500

# SAMD21 tem 32 KB de RAM: pilha de rede enxuta
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_MAX_CONN=4
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_TCP_WORKQ_STACK_SIZE=768
CONFIG_NET_RX_STACK_SIZE=1024
CONFIG_NET_TX_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=768
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_INPUT_THREAD_STACK_SIZE=512
# log síncrono via printk: economiza ~2 KB (sem thread nem buffer de log)
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_ISR_STACK_SIZE=1024

# SAMD21 não tem TRNG; o TCP precisa de números aleatórios (portas, ISN).
# Não é seguro para criptografia, mas aqui não há TLS.
CONFIG_TEST_RANDOM_GENERATOR=y
