# OLED1: display SSD1306 por SPI + botões (gpio-keys) + LEDs
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_HEAP_MEM_POOL_SIZE=1024

# Ethernet SPI (o driver vem de eth_ksz8851snl.overlay)
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y

# Endereco da placa por DHCP: basta plugar o cabo no roteador.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_DHCPV4=y

# String vazia faz o setup_ipv4() do net_config nao adicionar endereco nenhum
# e deixar tudo para o DHCP. Para voltar ao IP fixo, basta preencher.
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_MY_IPV4_NETMASK=""
CONFIG_NET_CONFIG_MY_IPV4_GW=""

# No padrao (30 s) o Zephyr segura o main() esperando a interface e o OLED fica
# apagado esse tempo todo. O cliente DHCP escuta NET_EVENT_IF_UP sozinho.
CONFIG_NET_CONFIG_INIT_TIMEOUT=1
CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=1500

# DNS desligado: o getaddrinfo resolve IP literal sem o resolver, que custava
# ~3 KB de RAM. Para usar nome, acrescentar (o http.c nao muda):
#   CONFIG_DNS_RESOLVER=y
#   CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
#   CONFIG_NET_SOCKETS_DNS_TIMEOUT=1500
#   CONFIG_DNS_RESOLVER_MAX_QUERY_LEN=64
#   CONFIG_DNS_RESOLVER_MAX_ANSWER_SIZE=256
#   CONFIG_DNS_RESOLVER_ADDITIONAL_BUF_CTR=0
#   CONFIG_DNS_RESOLVER_CACHE=y
#   CONFIG_DNS_RESOLVER_CACHE_MAX_ENTRIES=2

# SAMD21 tem 32 KB de RAM: pilha de rede enxuta
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=12
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_MAX_CONN=4
CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_TCP_WORKQ_STACK_SIZE=768
CONFIG_NET_RX_STACK_SIZE=1024
CONFIG_NET_TX_STACK_SIZE=1024
CONFIG_NET_MGMT_EVENT_STACK_SIZE=768
CONFIG_MAIN_STACK_SIZE=1024
# A transmissao roda na workqueue do sistema e a cadeia ate o spi_sam0 e funda:
# com 1 KB (o padrao) ela estourava.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280
# Sem MPU no SAMD21, estouro de pilha corrompe memoria em silencio; o
# sentinela transforma isso em panico com mensagem.
CONFIG_STACK_SENTINEL=y
CONFIG_INPUT_THREAD_STACK_SIZE=512
# log síncrono via printk: economiza ~2 KB (sem thread nem buffer de log)
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_ISR_STACK_SIZE=1024

# SAMD21 não tem TRNG; o TCP precisa de números aleatórios (portas, ISN).
# Não é seguro para criptografia, mas aqui não há TLS.
CONFIG_TEST_RANDOM_GENERATOR=y
