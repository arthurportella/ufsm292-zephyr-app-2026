# Roda o supervisor no PC (Linux) usando os sockets do host: testa toda a
# lógica contra o simulador (pasta sim/) sem placa. Sem display: as telas
# saem no console.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n

CONFIG_SUPERVISOR_GATEWAY_ADDR="127.0.0.1"
CONFIG_SUPERVISOR_SERVER_ADDR="127.0.0.1"
